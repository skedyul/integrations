name: Default REA Enquiry Created
handle: sync-rea-enquiry-from-webhook
description: "Upsert CRM customer, property, property ownership, and enquiry when app.realestate.enquiry.created arrives via REA webhook (uses install CRM maps)"

variables:
  label-enquiry-created: "New REA enquiry"

inputs:
  data:
    type: "@app/realestate/enquiry/created"
    label: Enquiry event data
    description: Nested REA enquiry payload ({ webhook, agency, enquiry })
    required: true

outputs:
  customer-id:
    type: string
    description: "Upserted customer instance ID"
    value: "{{ steps.upsert-customer.outputs.response.results[0].instanceId }}"
  property-id:
    type: string
    description: "Upserted property instance ID"
    value: "{{ steps.upsert-property.outputs.response.results[0].instanceId }}"
  property-ownership-id:
    type: string
    description: "Upserted property ownership instance ID"
    value: "{{ steps.upsert-property-ownership.outputs.response.results[0].instanceId }}"
  enquiry-id:
    type: string
    description: "Upserted enquiry instance ID"
    value: "{{ steps.upsert-enquiry.outputs.response.results[0].instanceId }}"
  contact-id:
    type: string
    description: "Conversation contact linked to the customer"
    value: "{% if steps.resolve-contact.outputs.response.contact-id != blank %}{{ steps.resolve-contact.outputs.response.contact-id }}{% else %}{{ steps.ensure-contact.outputs.response.data.id }}{% endif %}"
  signal-block-id:
    type: string
    description: "SIGNAL contact block created for the enquiry"
    value: "{{ steps.send-enquiry-signal.outputs.response.block-id }}"

steps:
  build-customer-payload:
    type: task
    name: Build customer CRM payload
    timeout: 30 seconds
    if: "{{ 'model_handle' | realestate: 'present', 'customer' }}"
    service:
      name: skedyul/tools
      cmd: liquid.render
    inputs:
      outputFormat: json
      template: |
        {
          "customer": {
            "first_name": {{ inputs.data.enquiry.first_name | json }},
            "last_name": {{ inputs.data.enquiry.last_name | json }},
            "email": {{ inputs.data.enquiry.email | json }},
            "phone": {{ inputs.data.enquiry.phone | json }},
            "preferred_contact_method": {{ inputs.data.enquiry.preferred_contact_method | json }}
          }
        }

  format-customer:
    needs: [build-customer-payload]
    type: task
    name: Format customer for CRM
    timeout: 30 seconds
    if: "{{ steps.build-customer-payload.outputs.response.data != blank }}"
    service:
      name: skedyul/tools
      cmd: liquid.render
    inputs:
      outputFormat: json
      template: |
        [{{ steps.build-customer-payload.outputs.response.data | realestate: "format", "customer" | json }}]

  upsert-customer:
    needs: [format-customer]
    type: task
    name: Upsert customer via CRM map
    timeout: 5 minutes
    if: "{{ 'model_handle' | realestate: 'present', 'customer' and 'match_id' | realestate: 'present', 'customer' and steps.format-customer.outputs.response.data != blank }}"
    service:
      name: skedyul/crm
      cmd: instance.upsertMany
    inputs:
      model-handle: "{{ 'model_handle' | realestate: 'config', 'customer' }}"
      matchField: "{{ 'match_id' | realestate: 'config', 'customer' }}"
      matchFields: "{{ 'match_fields' | realestate: 'config', 'customer' | json }}"
      errorMode: partial
      data: "{{ steps.format-customer.outputs.response.data }}"

  build-property-payload:
    type: task
    name: Build property CRM payload
    timeout: 30 seconds
    if: "{{ 'model_handle' | realestate: 'present', 'property' }}"
    service:
      name: skedyul/tools
      cmd: liquid.render
    inputs:
      outputFormat: json
      template: |
        {
          "property": {
            "listing_id": {{ inputs.data.enquiry.listing_id | json }},
            "address": {{ inputs.data.enquiry.listing_address | json }}
          }
        }

  format-property:
    needs: [build-property-payload]
    type: task
    name: Format property for CRM
    timeout: 30 seconds
    if: "{{ steps.build-property-payload.outputs.response.data != blank }}"
    service:
      name: skedyul/tools
      cmd: liquid.render
    inputs:
      outputFormat: json
      template: |
        [{{ steps.build-property-payload.outputs.response.data | realestate: "format", "property" | json }}]

  upsert-property:
    needs: [format-property]
    type: task
    name: Upsert property via CRM map
    timeout: 5 minutes
    if: "{{ 'model_handle' | realestate: 'present', 'property' and 'match_id' | realestate: 'present', 'property' and steps.format-property.outputs.response.data != blank }}"
    service:
      name: skedyul/crm
      cmd: instance.upsertMany
    inputs:
      model-handle: "{{ 'model_handle' | realestate: 'config', 'property' }}"
      matchField: "{{ 'match_id' | realestate: 'config', 'property' }}"
      matchFields: "{{ 'match_fields' | realestate: 'config', 'property' | json }}"
      errorMode: partial
      data: "{{ steps.format-property.outputs.response.data }}"

  build-property-ownership-payload:
    needs: [upsert-customer, upsert-property]
    on-parent-skip: run
    type: task
    name: Build property ownership CRM payload
    timeout: 30 seconds
    if: "{% assign contact_id = inputs.data.enquiry.phone | default: inputs.data.enquiry.email %}{% if 'model_handle' | realestate: 'present', 'property_ownership' and steps.upsert-customer.outputs.response.results[0].instanceId != blank and steps.upsert-property.outputs.response.results[0].instanceId != blank and contact_id != blank %}true{% else %}false{% endif %}"
    service:
      name: skedyul/tools
      cmd: liquid.render
    inputs:
      outputFormat: json
      template: |
        {%- assign customer_id = steps.upsert-customer.outputs.response.results[0].instanceId -%}
        {%- assign property_id = steps.upsert-property.outputs.response.results[0].instanceId -%}
        {%- assign listing_id = inputs.data.enquiry.listing_id -%}
        {%- assign contact_id = inputs.data.enquiry.phone | default: inputs.data.enquiry.email -%}
        {%- assign ownership_left = listing_id | default: property_id -%}
        {
          "property_ownership": {
            "ownership_key": {{ ownership_left | append: ':' | append: contact_id | json }},
            "customer": {{ customer_id | json }},
            "property": {{ property_id | json }}
          }
        }

  format-property-ownership:
    needs: [build-property-ownership-payload]
    type: task
    name: Format property ownership for CRM
    timeout: 30 seconds
    if: "{{ steps.build-property-ownership-payload.outputs.response.data != blank }}"
    service:
      name: skedyul/tools
      cmd: liquid.render
    inputs:
      outputFormat: json
      template: |
        [{{ steps.build-property-ownership-payload.outputs.response.data | realestate: "format", "property_ownership" | json }}]

  upsert-property-ownership:
    needs: [format-property-ownership]
    type: task
    name: Upsert property ownership via CRM map
    timeout: 5 minutes
    if: "{{ 'model_handle' | realestate: 'present', 'property_ownership' and 'match_id' | realestate: 'present', 'property_ownership' and steps.format-property-ownership.outputs.response.data != blank }}"
    service:
      name: skedyul/crm
      cmd: instance.upsertMany
    inputs:
      model-handle: "{{ 'model_handle' | realestate: 'config', 'property_ownership' }}"
      matchField: "{{ 'match_id' | realestate: 'config', 'property_ownership' }}"
      matchFields: "{{ 'match_fields' | realestate: 'config', 'property_ownership' | json }}"
      errorMode: partial
      data: "{{ steps.format-property-ownership.outputs.response.data }}"

  build-enquiry-payload:
    needs: [upsert-customer, upsert-property]
    on-parent-skip: run
    type: task
    name: Build enquiry CRM payload
    timeout: 30 seconds
    if: "{{ 'model_handle' | realestate: 'present', 'enquiry' }}"
    service:
      name: skedyul/tools
      cmd: liquid.render
    inputs:
      outputFormat: json
      template: |
        {%- assign customer_id = steps.upsert-customer.outputs.response.results[0].instanceId -%}
        {%- assign property_id = steps.upsert-property.outputs.response.results[0].instanceId -%}
        {
          "enquiry": {
            "rea_enquiry_id": {{ inputs.data.enquiry.rea_enquiry_id | json }},
            "rea_agency_id": {{ inputs.data.enquiry.rea_agency_id | json }},
            "enquiry_type": {{ inputs.data.enquiry.enquiry_type | json }},
            "comments": {{ inputs.data.enquiry.comments | json }},
            "source": {{ inputs.data.enquiry.source | json }},
            "received_at": {{ inputs.data.enquiry.received_at | json }},
            "processed_at": {{ inputs.data.enquiry.processed_at | json }},
            "postcode": {{ inputs.data.enquiry.postcode | json }},
            "preferred_contact_method": {{ inputs.data.enquiry.preferred_contact_method | json }}
            {%- if customer_id != blank -%}
            ,"customer": {{ customer_id | json }}
            {%- endif -%}
            {%- if property_id != blank -%}
            ,"property": {{ property_id | json }}
            {%- endif -%}
          }
        }

  format-enquiry:
    needs: [build-enquiry-payload]
    type: task
    name: Format enquiry for CRM
    timeout: 30 seconds
    if: "{{ steps.build-enquiry-payload.outputs.response.data != blank }}"
    service:
      name: skedyul/tools
      cmd: liquid.render
    inputs:
      outputFormat: json
      template: |
        [{{ steps.build-enquiry-payload.outputs.response.data | realestate: "format", "enquiry" | json }}]

  upsert-enquiry:
    needs: [format-enquiry]
    type: task
    name: Upsert enquiry via CRM map
    timeout: 5 minutes
    if: "{{ 'model_handle' | realestate: 'present', 'enquiry' and 'match_id' | realestate: 'present', 'enquiry' and steps.format-enquiry.outputs.response.data != blank }}"
    service:
      name: skedyul/crm
      cmd: instance.upsertMany
    inputs:
      model-handle: "{{ 'model_handle' | realestate: 'config', 'enquiry' }}"
      matchField: "{{ 'match_id' | realestate: 'config', 'enquiry' }}"
      matchFields: "{{ 'match_fields' | realestate: 'config', 'enquiry' | json }}"
      errorMode: partial
      data: "{{ steps.format-enquiry.outputs.response.data }}"

  resolve-contact:
    needs: [upsert-customer]
    on-parent-skip: run
    type: task
    name: Resolve conversation contact
    description: Find existing conversation contact linked to the customer
    timeout: 1 minute
    if: "{{ steps.upsert-customer.outputs.response.results[0].instanceId != blank }}"
    service:
      name: skedyul/conversations
      cmd: contact.resolve
    inputs:
      instance-id: "{{ steps.upsert-customer.outputs.response.results[0].instanceId }}"

  ensure-contact:
    needs: [upsert-customer, resolve-contact]
    on-parent-skip: run
    type: task
    name: Ensure conversation contact
    description: Create conversation contact linked to the customer when none exists yet
    timeout: 2 minutes
    if: "{% if steps.upsert-customer.outputs.response.results[0].instanceId != blank and steps.resolve-contact.outputs.response.contact-id == blank %}true{% else %}false{% endif %}"
    service:
      name: skedyul/conversations
      cmd: contact.create
    inputs:
      name: "{{ inputs.data.enquiry.first_name }} {{ inputs.data.enquiry.last_name }}"
      associations:
        - instance-id: "{{ steps.upsert-customer.outputs.response.results[0].instanceId }}"

  build-enquiry-data-blocks:
    type: task
    name: Build enquiry signal data blocks
    description: Shape enquiry into profile DataBlocks for the UI
    timeout: 30 seconds
    service:
      name: skedyul/tools
      cmd: liquid.render
    inputs:
      outputFormat: json
      template: |
        [
          {
            "type": "profile",
            "title": {{ inputs.data.enquiry.first_name | append: ' ' | append: inputs.data.enquiry.last_name | strip | default: "REA enquiry" | json }},
            "fields": [
              {%- assign field_first = true -%}
              {%- if inputs.data.enquiry.email != blank -%}
              {%- unless field_first -%},{%- endunless -%}{ "label": "Email", "value": {{ inputs.data.enquiry.email | json }} }
              {%- assign field_first = false -%}
              {%- endif -%}
              {%- if inputs.data.enquiry.phone != blank -%}
              {%- unless field_first -%},{%- endunless -%}{ "label": "Phone", "value": {{ inputs.data.enquiry.phone | json }} }
              {%- assign field_first = false -%}
              {%- endif -%}
              {%- if inputs.data.agency.agency_id != blank -%}
              {%- unless field_first -%},{%- endunless -%}{ "label": "Agency", "value": {{ inputs.data.agency.agency_id | json }} }
              {%- assign field_first = false -%}
              {%- endif -%}
              {%- if inputs.data.enquiry.listing_address != blank -%}
              {%- unless field_first -%},{%- endunless -%}{ "label": "Listing", "value": {{ inputs.data.enquiry.listing_address | json }} }
              {%- assign field_first = false -%}
              {%- endif -%}
              {%- if inputs.data.enquiry.comments != blank -%}
              {%- unless field_first -%},{%- endunless -%}{ "label": "Comments", "value": {{ inputs.data.enquiry.comments | json }} }
              {%- assign field_first = false -%}
              {%- endif -%}
            ]
          }
        ]

  build-enquiry-signal-description:
    type: task
    name: Build enquiry signal description
    description: Render the thread signal label
    timeout: 30 seconds
    service:
      name: skedyul/tools
      cmd: liquid.render
    inputs:
      template: |
        {{ variables.label-enquiry-created }}{% if enquiry_name != blank %} — {{ enquiry_name }}{% endif %}{% if listing != blank %} · {{ listing }}{% endif %}
      data:
        enquiry_name: "{{ inputs.data.enquiry.first_name }} {{ inputs.data.enquiry.last_name }}"
        listing: "{{ inputs.data.enquiry.listing_address }}"

  send-enquiry-signal:
    needs: [resolve-contact, ensure-contact, build-enquiry-data-blocks, build-enquiry-signal-description]
    type: task
    name: Signal enquiry on contact
    description: Post a contact signal for the REA enquiry
    timeout: 1 minute
    if: "{% if steps.resolve-contact.outputs.response.contact-id != blank %}true{% elsif steps.ensure-contact.outputs.response.data.id != blank %}true{% else %}false{% endif %}"
    service:
      name: skedyul/conversations
      cmd: contact.signal.create
    inputs:
      contact-id: "{% if steps.resolve-contact.outputs.response.contact-id != blank %}{{ steps.resolve-contact.outputs.response.contact-id }}{% else %}{{ steps.ensure-contact.outputs.response.data.id }}{% endif %}"
      description: "{{ steps.build-enquiry-signal-description.outputs.response }}"
      app-handle: realestate
      handle: enquiry-created
      metadata:
        event-type: "{{ context.event.type }}"
        event-id: "{{ context.event.id }}"
        dataBlocks: "{{ steps.build-enquiry-data-blocks.outputs.response.data }}"
