name: Default Realestate Enquiry Event
handle: sync-rea-enquiry-from-webhook
description: "Create-or-find CRM Lead, always upsert Enquiry linked to Lead, and signal conversation contact when app.realestate.enquiry.created arrives (uses install CRM maps)"

variables:
  label-enquiry-created: "New REA enquiry"

inputs:
  data:
    type: "@app/realestate/enquiry/created"
    label: Enquiry event data
    description: Nested REA enquiry payload ({ webhook, agency, enquiry })
    required: true

outputs:
  lead-id:
    type: string
    description: "Upserted lead instance ID"
    value: "{{ steps.sync-lead.outputs.data.lead-id }}"
  enquiry-id:
    type: string
    description: "Upserted enquiry instance ID"
    value: "{{ steps.upsert-enquiry.outputs.response.results[0].instanceId }}"
  contact-id:
    type: string
    description: "Conversation contact linked to the lead"
    value: "{% if steps.resolve-contact.outputs.response.contact-id != blank %}{{ steps.resolve-contact.outputs.response.contact-id }}{% else %}{{ steps.ensure-contact.outputs.response.data.id }}{% endif %}"
  signal-block-id:
    type: string
    description: "SIGNAL contact block created for the enquiry"
    value: "{{ steps.send-enquiry-signal.outputs.response.block-id }}"

steps:
  build-lead-payload:
    type: task
    name: Build lead CRM payload
    description: Shape enquiry contact details into a lead envelope for the CRM map
    timeout: 30 seconds
    if: "{% assign has_lead = 'model_handle' | realestate: 'present', 'lead' %}{% assign has_identity = false %}{% if inputs.data.enquiry.email != blank or inputs.data.enquiry.phone != blank %}{% assign has_identity = true %}{% endif %}{{ has_lead and has_identity }}"
    service:
      name: skedyul/tools
      cmd: liquid.render
    inputs:
      outputFormat: json
      template: |
        {
          "lead": {
            "first_name": {{ inputs.data.enquiry.first_name | json }},
            "last_name": {{ inputs.data.enquiry.last_name | json }},
            "email": {{ inputs.data.enquiry.email | json }},
            "phone": {{ inputs.data.enquiry.phone | json }},
            "postcode": {{ inputs.data.enquiry.postcode | json }},
            "preferred_contact_method": {{ inputs.data.enquiry.preferred_contact_method | json }}
          }
        }

  sync-lead:
    needs: [build-lead-payload]
    type: workflow
    name: Sync REA lead
    description: Create-or-find CRM lead via lead CRM map
    run: sync-rea-lead
    if: "{{ steps.build-lead-payload.outputs.response.data != blank }}"
    inputs:
      data: "{{ steps.build-lead-payload.outputs.response.data }}"

  build-enquiry-payload:
    needs: [sync-lead]
    on-parent-skip: run
    type: task
    name: Build enquiry CRM payload
    description: Shape enquiry fields and optional lead relationship for the CRM map
    timeout: 30 seconds
    if: "{% assign has_enquiry = 'model_handle' | realestate: 'present', 'enquiry' %}{{ has_enquiry and inputs.data.enquiry.rea_enquiry_id != blank }}"
    service:
      name: skedyul/tools
      cmd: liquid.render
    inputs:
      outputFormat: json
      template: |
        {
          "enquiry": {
            "rea_enquiry_id": {{ inputs.data.enquiry.rea_enquiry_id | json }},
            "rea_agency_id": {{ inputs.data.enquiry.rea_agency_id | json }},
            "enquiry_type": {{ inputs.data.enquiry.enquiry_type | json }},
            "comments": {{ inputs.data.enquiry.comments | json }},
            "received_at": {{ inputs.data.enquiry.received_at | json }},
            "processed_at": {{ inputs.data.enquiry.processed_at | json }},
            "listing_id": {{ inputs.data.enquiry.listing_id | json }},
            "listing_address": {{ inputs.data.enquiry.listing_address | json }},
            "source": {{ inputs.data.enquiry.source | json }},
            "lead": {{ steps.sync-lead.outputs.data.lead-id | json }}
          }
        }

  format-enquiry:
    needs: [build-enquiry-payload]
    type: task
    name: Format enquiry for CRM
    description: Apply install CRM map for entity enquiry
    timeout: 30 seconds
    if: "{{ steps.build-enquiry-payload.outputs.response.data != blank }}"
    service:
      name: skedyul/tools
      cmd: liquid.render
    inputs:
      outputFormat: json
      template: |
        [{{ steps.build-enquiry-payload.outputs.response.data | realestate: "format", "enquiry" | json }}]

  upsert-enquiry:
    needs: [format-enquiry]
    type: task
    name: Upsert enquiry via CRM map
    description: Always upsert enquiry matched on rea_enquiry_id; link to lead when available
    timeout: 5 minutes
    if: "{% assign has_enquiry = 'model_handle' | realestate: 'present', 'enquiry' %}{% assign has_enquiry_match = 'match_id' | realestate: 'present', 'enquiry' %}{{ has_enquiry and has_enquiry_match and steps.format-enquiry.outputs.response.data != blank }}"
    service:
      name: skedyul/crm
      cmd: instance.upsertMany
    inputs:
      model-handle: "{{ 'model_handle' | realestate: 'config', 'enquiry' }}"
      matchField: "{{ 'match_id' | realestate: 'config', 'enquiry' }}"
      matchFields: "{{ 'match_fields' | realestate: 'config', 'enquiry' | json }}"
      errorMode: partial
      data: "{{ steps.format-enquiry.outputs.response.data }}"

  resolve-contact:
    needs: [sync-lead]
    on-parent-skip: run
    type: task
    name: Resolve conversation contact
    description: Find existing conversation contact linked to the lead instance
    timeout: 1 minute
    if: "{{ steps.sync-lead.outputs.data.lead-id != blank }}"
    service:
      name: skedyul/conversations
      cmd: contact.resolve
    inputs:
      instance-id: "{{ steps.sync-lead.outputs.data.lead-id }}"

  ensure-contact:
    needs: [sync-lead, resolve-contact]
    on-parent-skip: run
    type: task
    name: Ensure conversation contact
    description: Create conversation contact linked to the lead when none exists yet
    timeout: 2 minutes
    if: "{{ steps.sync-lead.outputs.data.lead-id != blank and steps.resolve-contact.outputs.response.contact-id == blank }}"
    service:
      name: skedyul/conversations
      cmd: contact.create
    inputs:
      name: "{{ inputs.data.enquiry.first_name }} {{ inputs.data.enquiry.last_name }}"
      associations:
        - instance-id: "{{ steps.sync-lead.outputs.data.lead-id }}"

  build-enquiry-data-blocks:
    type: task
    name: Build enquiry signal data blocks
    description: Shape enquiry into profile DataBlocks for the UI
    timeout: 30 seconds
    service:
      name: skedyul/tools
      cmd: liquid.render
    inputs:
      outputFormat: json
      template: |
        [
          {
            "type": "profile",
            "title": {{ inputs.data.enquiry.first_name | append: ' ' | append: inputs.data.enquiry.last_name | strip | default: "REA enquiry" | json }},
            "fields": [
              {%- assign field_first = true -%}
              {%- if inputs.data.enquiry.email != blank -%}
              {%- unless field_first -%},{%- endunless -%}{ "label": "Email", "value": {{ inputs.data.enquiry.email | json }} }
              {%- assign field_first = false -%}
              {%- endif -%}
              {%- if inputs.data.enquiry.phone != blank -%}
              {%- unless field_first -%},{%- endunless -%}{ "label": "Phone", "value": {{ inputs.data.enquiry.phone | json }} }
              {%- assign field_first = false -%}
              {%- endif -%}
              {%- if inputs.data.agency.agency_id != blank -%}
              {%- unless field_first -%},{%- endunless -%}{ "label": "Agency", "value": {{ inputs.data.agency.agency_id | json }} }
              {%- assign field_first = false -%}
              {%- endif -%}
              {%- if inputs.data.enquiry.listing_address != blank -%}
              {%- unless field_first -%},{%- endunless -%}{ "label": "Listing", "value": {{ inputs.data.enquiry.listing_address | json }} }
              {%- assign field_first = false -%}
              {%- endif -%}
              {%- if inputs.data.enquiry.comments != blank -%}
              {%- unless field_first -%},{%- endunless -%}{ "label": "Comments", "value": {{ inputs.data.enquiry.comments | json }} }
              {%- assign field_first = false -%}
              {%- endif -%}
            ]
          }
        ]

  build-enquiry-signal-description:
    type: task
    name: Build enquiry signal description
    description: Render the thread signal label
    timeout: 30 seconds
    service:
      name: skedyul/tools
      cmd: liquid.render
    inputs:
      template: |
        {{ variables.label-enquiry-created }}{% if enquiry_name != blank %} — {{ enquiry_name }}{% endif %}{% if listing != blank %} · {{ listing }}{% endif %}
      data:
        enquiry_name: "{{ inputs.data.enquiry.first_name }} {{ inputs.data.enquiry.last_name }}"
        listing: "{{ inputs.data.enquiry.listing_address }}"

  send-enquiry-signal:
    needs: [resolve-contact, ensure-contact, build-enquiry-data-blocks, build-enquiry-signal-description]
    type: task
    name: Signal enquiry on contact
    description: Post a contact signal for the REA enquiry
    timeout: 1 minute
    if: "{% if steps.resolve-contact.outputs.response.contact-id != blank %}true{% elsif steps.ensure-contact.outputs.response.data.id != blank %}true{% else %}false{% endif %}"
    service:
      name: skedyul/conversations
      cmd: contact.signal.create
    inputs:
      contact-id: "{% if steps.resolve-contact.outputs.response.contact-id != blank %}{{ steps.resolve-contact.outputs.response.contact-id }}{% else %}{{ steps.ensure-contact.outputs.response.data.id }}{% endif %}"
      description: "{{ steps.build-enquiry-signal-description.outputs.response }}"
      app-handle: realestate
      handle: enquiry-created
      metadata:
        event-type: "{{ context.event.type }}"
        event-id: "{{ context.event.id }}"
        dataBlocks: "{{ steps.build-enquiry-data-blocks.outputs.response.data }}"
