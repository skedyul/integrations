name: Sync REA Lead
handle: sync-rea-lead
description: "Upsert CRM lead/prospect from REA contact fields using the install CRM map (| realestate: format/config, lead)"

variables: {}

inputs:
  data:
    label: Lead data
    description: Lead envelope or object ({ lead: { first_name, last_name, email, phone, ... } })
    required: true
    type: object

outputs:
  lead-id:
    type: string
    description: Upserted lead instance ID
    value: "{{ steps.upsert-lead.outputs.response.results[0].instanceId }}"
  match-mode:
    type: string
    description: Resolved via configured match field
    value: "{% if steps.upsert-lead.outputs.response.results[0].instanceId != blank %}mapped{% else %}none{% endif %}"

steps:
  build-upsert-payload:
    type: task
    name: Format lead for CRM
    description: Apply install CRM map for entity lead
    timeout: 30 seconds
    if: "{{ 'model_handle' | realestate: 'present', 'lead' }}"
    service:
      name: skedyul/tools
      cmd: liquid.render
    inputs:
      outputFormat: json
      template: |
        [{{ inputs.data | realestate: "format", "lead" | json }}]

  upsert-lead:
    needs: [build-upsert-payload]
    type: task
    name: Upsert lead via CRM map
    description: Match on configured match field and upsert mapped fields
    timeout: 5 minutes
    if: "{% assign has_lead = 'model_handle' | realestate: 'present', 'lead' %}{% assign has_lead_match = 'match_id' | realestate: 'present', 'lead' %}{{ has_lead and has_lead_match and steps.build-upsert-payload.outputs.response.data != blank }}"
    service:
      name: skedyul/crm
      cmd: instance.upsertMany
    inputs:
      model-handle: "{{ 'model_handle' | realestate: 'config', 'lead' }}"
      matchField: "{{ 'match_id' | realestate: 'config', 'lead' }}"
      matchFields: "{{ 'match_fields' | realestate: 'config', 'lead' | json }}"
      errorMode: partial
      data: "{{ steps.build-upsert-payload.outputs.response.data }}"
