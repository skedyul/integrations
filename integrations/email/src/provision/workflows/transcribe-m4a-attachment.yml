name: Transcribe M4A Email Attachment
handle: transcribe-m4a-attachment
description: "Read an inbound email M4A attachment, transcribe it with object.generate, and return {success: true/false}."

variables: {}

# Subscribe in the UI (or agent YAML) to:
#   type: thread.attachment.received
#   condition: "{{ data.attachment.name contains '.m4a' or data.attachment.mimeType contains 'm4a' }}"
#   input mappings:
#     thread-id            ← resource.id
#     message-id           ← data.message.id
#     file-id              ← data.attachment.fileId
#     attachment-name      ← data.attachment.name
#     attachment-mime-type ← data.attachment.mimeType

inputs:
  thread-id:
    label: "Thread ID"
    description: "The ID of the email thread that received the attachment"
    required: false
    type: id
  message-id:
    label: "Message ID"
    description: "The ID of the email message the attachment belongs to"
    required: false
    type: id
  file-id:
    label: "File ID"
    description: "S3-backed File id of the M4A email attachment"
    required: true
    type: id
  attachment-name:
    label: "Attachment Name"
    description: "Original filename (used to skip non-M4A files when present)"
    required: false
    type: string
  attachment-mime-type:
    label: "Attachment MIME Type"
    description: "MIME type from the email attachment (audio/mp4, audio/x-m4a)"
    required: false
    type: string

outputs:
  result:
    description: "Simple result object {success: true/false}"
    type: "object"
    value: "{{ steps.build-result.outputs.response.data }}"
  success:
    description: "Whether transcription succeeded"
    type: "boolean"
    value: "{{ steps.build-result.outputs.response.data.success }}"
  transcript:
    description: "Full audio transcript from object.generate"
    type: "string"
    value: "{{ steps.generate-object.outputs.transcript }}"

steps:
  generate-object:
    type: "task"
    name: "Transcribe M4A attachment"
    description: "Load the M4A file from S3 and transcribe it via object.generate audio mode"
    timeout: 5 minutes
    if: "{% assign n = inputs.attachment-name | downcase %}{% assign m = inputs.attachment-mime-type | downcase %}{% if n == blank and m == blank %}true{% elsif n contains '.m4a' or m contains 'm4a' %}true{% else %}false{% endif %}"
    service:
      name: "skedyul/ai"
      cmd: "object.generate"
      options:
        mode: audio
        system: |-
          You decide whether an audio transcript was produced successfully.
          Return JSON matching the schema. Set success to true only when the
          transcript contains audible speech. Set success to false for silence,
          empty audio, or unintelligible recordings. Do not invent speech.
    inputs:
      file: "{{ inputs.file-id }}"
      prompt: |-
        Transcribe this M4A email attachment. Set success to true if the
        recording contains usable speech, otherwise false.
      object-definition: |-
        {
          "success": {
            "type": "boolean",
            "required": true,
            "description": "True when the M4A audio was transcribed and contains usable speech"
          }
        }

  build-result:
    needs: [generate-object]
    on-parent-skip: run
    on-parent-error: run
    type: "task"
    name: "Build success object"
    description: "Always return {success: true/false} even when the audio step is skipped"
    timeout: 30 seconds
    service:
      name: "skedyul/tools"
      cmd: "liquid.render"
    inputs:
      outputFormat: json
      template: |
        {
          "success": {% if steps.generate-object.outputs.response.success %}true{% else %}false{% endif %}
        }
