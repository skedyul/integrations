name: Push Calendar Event Rename to Google
handle: push-calendar-event-rename-to-google
description: "When a mapped calendar event title changes in CRM, patch the Google Calendar event summary. Skips Google-originated writes so import and inbound sync do not loop."

variables: {}

inputs:
  data:
    type: "@crm/calendar_event/updated"
    label: Calendar event
    description: Workplace calendar_event instance.updated payload (before/after/changedFields)
    required: true

outputs:
  google-event-id:
    type: string
    description: Google event id that was patched
    value: "{{ steps.push-google.outputs.response.data.event.google_event_id }}"
  summary:
    type: string
    description: Title written to Google
    value: "{{ steps.push-google.outputs.response.data.event.summary }}"

steps:
  build-update:
    type: task
    name: Build Google event patch
    description: Unformat the CRM record through the calendar_event map and keep title-only patches
    timeout: 30 seconds
    if: "{{ 'model_handle' | google: 'present', 'calendar_event' }}"
    service:
      name: skedyul/tools
      cmd: liquid.render
    inputs:
      outputFormat: json
      template: |
        {%- assign before = inputs.data.before | google: "unformat", "calendar_event" -%}
        {%- assign after = inputs.data.after | google: "unformat", "calendar_event" -%}
        {%- assign before_summary = before.summary -%}
        {%- assign after_summary = after.summary -%}
        {%- if before_summary[0] != blank and before_summary[1] == blank -%}
        {%- assign before_summary = before_summary[0] -%}
        {%- endif -%}
        {%- if after_summary[0] != blank and after_summary[1] == blank -%}
        {%- assign after_summary = after_summary[0] -%}
        {%- endif -%}
        {%- assign event_id = after.google_event_id -%}
        {%- if event_id[0] != blank and event_id[1] == blank -%}
        {%- assign event_id = event_id[0] -%}
        {%- endif -%}
        {%- assign calendar_id = after.calendar_id -%}
        {%- if calendar_id[0] != blank and calendar_id[1] == blank -%}
        {%- assign calendar_id = calendar_id[0] -%}
        {%- endif -%}
        {%- if after_summary != blank and event_id != blank and calendar_id != blank and after_summary != before_summary -%}
        {
          "calendar_id": {{ calendar_id | json }},
          "event_id": {{ event_id | json }},
          "summary": {{ after_summary | json }}
        }
        {%- else -%}
        {}
        {%- endif -%}

  push-google:
    needs: [build-update]
    type: task
    name: Update Google Calendar event
    description: Patch the Google event title via calendar_event_update
    timeout: 2 minutes
    if: "{{ steps.build-update.outputs.response.data.event_id != blank }}"
    service:
      name: skedyul/app
      cmd: tool.call
      options:
        app: google
        toolName: calendar_event_update
    inputs:
      calendar_id: "{{ steps.build-update.outputs.response.data.calendar_id }}"
      event_id: "{{ steps.build-update.outputs.response.data.event_id }}"
      summary: "{{ steps.build-update.outputs.response.data.summary }}"
