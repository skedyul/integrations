name: Push Calendar Event Update to Google
handle: push-calendar-event-update-to-google
description: "When a mapped CRM record changes, unformat through the install map and patch the Google Calendar event. Skips Google-originated writes so import and inbound sync do not loop."

variables: {}

inputs:
  data:
    type: "@crm/*/updated"
    label: CRM record
    description: Workplace instance.updated payload for the model bound on the trigger (before/after/changedFields)
    required: true

outputs:
  google-event-id:
    type: string
    description: Google event id that was patched
    value: "{{ steps.push-google.outputs.response.data.event.google_event_id }}"
  summary:
    type: string
    description: Title on the Google event after the patch
    value: "{{ steps.push-google.outputs.response.data.event.summary }}"

steps:
  build-update:
    type: task
    name: Build Google event patch
    description: Unformat the CRM record through the map for the trigger-selected model
    timeout: 30 seconds
    if: "{{ 'model_handle' | google: 'present', inputs.data.model }}"
    service:
      name: skedyul/tools
      cmd: liquid.render
    inputs:
      outputFormat: json
      template: |
        {%- assign before = inputs.data.before | google: "unformat", inputs.data.model -%}
        {%- assign after = inputs.data.after | google: "unformat", inputs.data.model -%}
        {%- assign event_id = after.google_event_id -%}
        {%- if event_id[0] != blank and event_id[1] == blank -%}
        {%- assign event_id = event_id[0] -%}
        {%- endif -%}
        {%- assign calendar_id = after.calendar_id -%}
        {%- if calendar_id[0] != blank and calendar_id[1] == blank -%}
        {%- assign calendar_id = calendar_id[0] -%}
        {%- endif -%}
        {%- if event_id != blank and calendar_id != blank -%}
        {
          "calendar_id": {{ calendar_id | json }},
          "event_id": {{ event_id | json }},
          "before": {{ before | json }},
          "after": {{ after | json }}
        }
        {%- else -%}
        {}
        {%- endif -%}

  push-google:
    needs: [build-update]
    type: task
    name: Update Google Calendar event
    description: Patch mapped Google event fields via calendar_event_update
    timeout: 2 minutes
    if: "{{ steps.build-update.outputs.response.data.event_id != blank }}"
    service:
      name: skedyul/app
      cmd: tool.call
      options:
        app: google
        toolName: calendar_event_update
    inputs:
      calendar_id: "{{ steps.build-update.outputs.response.data.calendar_id }}"
      event_id: "{{ steps.build-update.outputs.response.data.event_id }}"
      before: "{{ steps.build-update.outputs.response.data.before | json }}"
      after: "{{ steps.build-update.outputs.response.data.after | json }}"
